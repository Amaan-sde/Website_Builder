server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Support for React SPA (Single Page Application) routing
    # If the user visits a route like /workspace or /dashboard, serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional health check endpoint
    location /healthz {
        access_log off;
        return 200 "OK\n";
    }
}
