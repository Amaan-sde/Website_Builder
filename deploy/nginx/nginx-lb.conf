events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Upstream backend pool for Layer-7 Round-Robin Load Balancing
    upstream backend_cluster {
        least_conn;
        server backend-1:3000 max_fails=3 fail_timeout=10s;
        server backend-2:3000 max_fails=3 fail_timeout=10s;
    }

    # Upstream frontend Vite server
    upstream frontend_server {
        server frontend:5173;
    }

    server {
        listen 80;
        server_name localhost 3.110.221.10 3.110.167.167 _;

        client_max_body_size 50M;

        # Gzip Compression
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        # API Routes - Load balanced across backend-1 & backend-2
        location /api/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # Deployed Public Sites - Load balanced
        location /site/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # Prometheus Telemetry Scraping Endpoint
        location /metrics {
            proxy_pass http://backend_cluster/metrics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Backend Health Check
        location = /health {
            proxy_pass http://backend_cluster/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Frontend Client & Single Page Application routing
        location / {
            proxy_pass http://frontend_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}

