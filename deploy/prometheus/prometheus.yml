global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape GenWeb Backend Cluster Replicas
  - job_name: 'genweb-backend-cluster'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['backend-1:3000', 'backend-2:3000']
        labels:
          environment: 'production'
          service: 'genweb-api-cluster'

  # Self-monitor Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
