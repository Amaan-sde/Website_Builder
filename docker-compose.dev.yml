# ==============================================================================
# Development Docker Compose for GenWeb.ai Website Builder
# Live code reloading with hot-module replacement (HMR) for both client & server
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Backend Development Container (Nodemon Live Reload)
  # ----------------------------------------------------------------------------
  backend-dev:
    image: node:20-alpine
    container_name: genweb-backend-dev
    working_dir: /app
    volumes:
      - ./server:/app
      - backend_dev_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL:-mongodb+srv://amaankhan172595_db_user:z8u32weMAfBTRXOL@cluster0.omlbuwj.mongodb.net/website_builder}
      - JWT_SECRET=${JWT_SECRET:-f1a8d2067c71e954350c12952189a7c3b5ae383fb247df5f051ea27367474b28}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-your_gemini_api_key_here}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-websitebuilder-ee244}
      - FIREBASE_WEB_API_KEY=${FIREBASE_WEB_API_KEY:-AIzaSyD0qjMAogy9-sEN12yvikBUgADT-pFwqhE}
      - ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000
    command: sh -c "npm install && npm run dev"
    networks:
      - dev-network

  # ----------------------------------------------------------------------------
  # Frontend Development Container (Vite HMR Live Reload)
  # ----------------------------------------------------------------------------
  frontend-dev:
    image: node:20-alpine
    container_name: genweb-frontend-dev
    working_dir: /app
    volumes:
      - ./client:/app
      - frontend_dev_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_SERVER_URL=http://localhost:3000
      - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY:-AIzaSyD0qjMAogy9-sEN12yvikBUgADT-pFwqhE}
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend-dev
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge

volumes:
  backend_dev_node_modules:
  frontend_dev_node_modules:
