version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Nginx Layer-7 Reverse Proxy & Load Balancer (Port 80)
  # ----------------------------------------------------------------------------
  nginx-lb:
    image: nginx:alpine
    container_name: genweb-nginx-lb
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx-lb.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
      - frontend
    networks:
      - genweb-network

  # ----------------------------------------------------------------------------
  # Backend Replica 1 (Node.js + Express API)
  # ----------------------------------------------------------------------------
  backend-1:
    build: ./server
    container_name: genweb-backend-1
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-mongodb+srv://amaankhan172595_db_user:z8u32weMAfBTRXOL@cluster0.omlbuwj.mongodb.net/website_builder}
      - JWT_SECRET=${JWT_SECRET:-f1a8d2067c71e954350c12952189a7c3b5ae383fb247df5f051ea27367474b28}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-your_gemini_api_key_here}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-websitebuilder-ee244}
      - FIREBASE_WEB_API_KEY=${FIREBASE_WEB_API_KEY:-AIzaSyD0qjMAogy9-sEN12yvikBUgADT-pFwqhE}
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:80,http://localhost,http://3.110.221.10:5173,http://3.110.221.10:80,http://3.110.221.10
    networks:
      - genweb-network

  # ----------------------------------------------------------------------------
  # Backend Replica 2 (Node.js + Express API)
  # ----------------------------------------------------------------------------
  backend-2:
    build: ./server
    container_name: genweb-backend-2
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-mongodb+srv://amaankhan172595_db_user:z8u32weMAfBTRXOL@cluster0.omlbuwj.mongodb.net/website_builder}
      - JWT_SECRET=${JWT_SECRET:-f1a8d2067c71e954350c12952189a7c3b5ae383fb247df5f051ea27367474b28}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-your_gemini_api_key_here}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-websitebuilder-ee244}
      - FIREBASE_WEB_API_KEY=${FIREBASE_WEB_API_KEY:-AIzaSyD0qjMAogy9-sEN12yvikBUgADT-pFwqhE}
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:80,http://localhost,http://3.110.221.10:5173,http://3.110.221.10:80,http://3.110.221.10
    networks:
      - genweb-network

  # ----------------------------------------------------------------------------
  # Frontend Service (React + Vite SPA)
  # ----------------------------------------------------------------------------
  frontend:
    build: ./client
    container_name: genweb-frontend
    restart: unless-stopped
    environment:
      - VITE_SERVER_URL=${VITE_SERVER_URL:-http://3.110.167.167:3000}
    networks:
      - genweb-network

  # ----------------------------------------------------------------------------
  # Prometheus Telemetry Collector (Port 9090)
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: genweb-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - genweb-network

  # ----------------------------------------------------------------------------
  # Grafana Observability Dashboards (Port 3002 -> 3000)
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.2.0
    container_name: genweb-grafana
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - genweb-network

networks:
  genweb-network:
    driver: bridge

